name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studysync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/studysync_test
    steps:
      - uses: actions/checkout@v4

      # Steps below are skipped until server/ has a package-lock.json
      - uses: actions/setup-node@v4
        if: hashFiles('server/package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        if: hashFiles('server/package-lock.json') != ''

      - run: npm run lint --if-present
        if: hashFiles('server/package-lock.json') != ''

      # Expected to create tables and seed the test database
      - run: npm run reset --if-present
        if: hashFiles('server/package-lock.json') != ''

      - run: npm test --if-present
        if: hashFiles('server/package-lock.json') != ''

  client:
    name: Client (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      # Steps below are skipped until client/ has a package-lock.json
      - uses: actions/setup-node@v4
        if: hashFiles('client/package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        if: hashFiles('client/package-lock.json') != ''

      - run: npm run lint --if-present
        if: hashFiles('client/package-lock.json') != ''

      - run: npm test --if-present
        if: hashFiles('client/package-lock.json') != ''

      - run: npm run build --if-present
        if: hashFiles('client/package-lock.json') != ''	